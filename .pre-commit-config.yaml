# Pre-commit hooks for tactics4sby.
#
# Install once per clone:      pre-commit install --install-hooks
# Run against all files:       pre-commit run --all-files
#
# The `pytest` hook is attached to the `pre-push` stage (see below) because the
# suite takes ~1 minute; the fast checks run on every commit.

default_language_version:
  python: python3

repos:
  # ---------------------------------------------------------------------------
  # Generic file hygiene.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: debug-statements

  # ---------------------------------------------------------------------------
  # JSON Schema validation of the proof strategy files (tests/ and examples/).
  # `proof_strategy.schema.json` describes the format read by parser.py; add
  # "\"$schema\": \"../proof_strategy.schema.json\"" to a strategy file to have
  # your editor validate it too.  `tests/ag_w_asserts.json` is excluded because
  # it is a stale fixture in an old format that no test loads.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-jsonschema
        name: check-jsonschema (proof strategies)
        args: [--schemafile, proof_strategy.schema.json]
        files: ^(tests|examples)/.*\.json$
        exclude: ^tests/ag_w_asserts\.json$

  # ---------------------------------------------------------------------------
  # Linting and formatting (config lives in pyproject.toml under [tool.ruff]).
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # Type checking with ty (Astral).  The hook checks the whole project, not
  # just the changed files, because a change in one module can introduce
  # diagnostics in another.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    hooks:
      - id: ty

  # ---------------------------------------------------------------------------
  # Test suite.  `language: system` is required: the tests import `pyosys`,
  # which is installed system-wide and has no pip metadata, so an isolated
  # pre-commit environment could not import it.  This hook therefore uses the
  # project venv directly (see README "Development" for how to create it).
  #
  # Attached to `pre-push` so a ~1 minute suite does not block every commit.
  # To run it on every commit instead, change `stages` to `[pre-commit]`.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest --no-cov -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
