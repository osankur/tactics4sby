[build-system]
# setuptools is the backend because the project is a flat set of top-level
# modules (no package directory), which setuptools handles via `py-modules`.
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tactics4sby"
version = "0.1.0"
description = "Produces an .sby configuration file from a proof strategy file, runs sby, and reports results."
readme = "README.md"
requires-python = ">=3.10"
# NOTE: `pyosys` is deliberately *not* declared as a dependency.  The project
# uses a locally built pyosys (Yosys 0.40+50) that has no pip metadata, so
# declaring it would make pip install PyPI's pyosys and shadow it.  Install it
# system-wide and use a `--system-site-packages` venv instead.
dependencies = []

[project.scripts]
# `pip install .` creates a `tactics4sby` executable that calls main().
tactics4sby = "tactics4sby:main"

[tool.setuptools]
# The project is a flat set of modules at the repository root; list them
# explicitly so setuptools does not try to auto-discover packages (which would
# also sweep in `tests/`).
py-modules = [
    "tactics4sby",
    "parser",
    "sby_generator",
    "sby_script",
    "configuration",
    "cell_graph",
    "logger",
]

# Configures pytest so that the flat modules at the repository root
# (tactics4sby.py, cell_graph.py, logger.py, ...) are importable from tests/
# without any sys.path manipulation in the test files, even when the project
# has not been installed.
#
# Run the suite from the repository root:  pytest
# Coverage is reported automatically (see [tool.coverage.*] below).

[dependency-groups]
# `uv sync` installs these; they are not needed to run the tool itself.
# NOTE: `pyosys` is deliberately *not* declared as a dependency.  The project
# uses a locally built pyosys (Yosys 0.40+50) that has no pip metadata, so
# declaring it would make `uv sync` install PyPI's pyosys and shadow it.
# Install it system-wide and use a `--system-site-packages` venv instead.
# `jsonschema` is a dev dependency only: it validates the strategy fixtures
# against `proof_strategy.schema.json` in `tests/test_schema.py`.
dev = ["pytest", "pytest-cov", "jsonschema>=4.18"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Coverage is on by default so that `pytest` alone reports it.  The
# `patch = ["subprocess"]` setting below is what makes the end-to-end CLI
# tests (which spawn `python tactics4sby.py ...`) contribute to the same report.
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
# Measure branch coverage, not just line coverage.
branch = true
# Only measure the project's own modules, not the tests or the venv.
source = ["."]
omit = ["tests/*", ".venv/*"]
# Start coverage in child Python processes too (the CLI tests run the tool
# via `subprocess`).  This implies `parallel = true`, so each process writes
# its own data file and pytest-cov combines them at the end of the run.
patch = ["subprocess"]

[tool.coverage.report]
# Show the line numbers that are not covered, and don't hide 100% files.
show_missing = true
skip_covered = false
# `if TYPE_CHECKING:` blocks and `raise NotImplementedError` stubs are not
# executable code worth chasing.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
# Declared explicitly so this file is unambiguously ruff's config root.
# `line-length` matches ruff's default; `target-version` is the interpreter
# the project runs on (the code needs >= 3.10 for its runtime-evaluated
# `X | Y` annotations).
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Ruff's default rule set, spelled out rather than left implicit.
select = ["E4", "E7", "E9", "F"]
